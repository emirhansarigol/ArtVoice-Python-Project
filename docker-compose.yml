version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: artvoice_postgres
    restart: always
    environment:
      POSTGRES_USER: artvoice_user
      POSTGRES_PASSWORD: artvoice_password
      POSTGRES_DB: artvoice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: artvoice_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: artvoice_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: quay.io/minio/minio:latest
    container_name: artvoice_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data


  api:
    build: .
    container_name: artvoice_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Kodları anlık günceller
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - redis

  worker:
    build: .
    container_name: artvoice_worker
    restart: always
    command: python worker.py
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - api

volumes:
  postgres_data:
  minio_data: